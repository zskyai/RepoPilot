name: RepoPilot CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Syntax check
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path("app")]
          files = []
          for root in roots:
              files.extend(root.rglob("*.py"))
          files.extend(Path(".").glob("run_*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"))
          print("syntax ok")
          PY

      - name: Unit tests
        run: python -m pytest -q
