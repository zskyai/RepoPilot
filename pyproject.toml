[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Production-shaped multi-agent RAG and evaluation platform for AI Agent interviews."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "langgraph>=0.2",
  "opentelemetry-api>=1.42",
  "opentelemetry-sdk>=1.42",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "qdrant-client>=1.18",
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.25",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
experimental = ["tree-sitter-language-pack>=1.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
